name: Release

# Publishes the public packages to npm. Deliberately MANUAL: publishing is
# triggered by running this workflow and typing the version, never as a side
# effect of pushing a tag. Tagging a release and publishing it are separate
# decisions, and an accidental `git push --tags` must not reach the registry.
#
# To release: `node scripts/sync-version.mjs <version>`, commit, tag, push —
# then run this workflow from the Actions tab (or `gh workflow run release.yml
# -f version=X.Y.Z`) and confirm. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json, e.g. 0.5.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The typed version must match the workspace, so a mistyped dispatch fails
      # here rather than publishing something unintended.
      - name: Verify the requested version matches the workspace
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          WANT="${REQUESTED#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$WANT" != "$PKG" ]; then
            echo "Requested $WANT but the workspace is at $PKG (run scripts/sync-version.mjs)"
            exit 1
          fi

      # turbo ^build orders the graph: source libs -> daemon bundle ->
      - run: pnpm build

      # pnpm -r publish skips private packages and rewrites workspace:* to the
      # concrete version. Publishes dailies-cli only; dailies-daemon and the
      # source-distributed libs stay private.
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
