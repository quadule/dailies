name: Release

# Publishes the public packages to npm. Deliberately MANUAL: publishing is
# triggered by running this workflow and typing the version, never as a side
# effect of pushing a tag. Tagging a release and publishing it are separate
# decisions, and an accidental `git push --tags` must not reach the registry.
#
# To release: `node scripts/sync-version.mjs <version>`, commit, tag, push —
# then dispatch this workflow ON THE TAG, so what is published is what was
# tagged rather than whatever main has drifted to since:
#
#   gh workflow run release.yml --ref vX.Y.Z -f version=X.Y.Z
#
# (or pick the tag as the ref when running **Release** from the Actions tab).
# The verify step below enforces that. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish — must match package.json AND the tag this is dispatched on (gh workflow run release.yml --ref v0.5.0 -f version=0.5.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # mints the OIDC token npm trusted publishing verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # package.json's packageManager is the single pnpm version pin.
      - uses: pnpm/action-setup@v6.1.0

      # NB: deliberately NO `registry-url:` here. setup-node would write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
      # and with trusted publishing there is no NODE_AUTH_TOKEN — so npm sends
      # an EMPTY token and the registry rejects the write with E401 instead of
      # npm falling back to OIDC. (Provenance still signs fine, which makes the
      # failure look unrelated to auth.) npm defaults to registry.npmjs.org.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Two checks, both of which have to hold before anything is built.
      #
      # 1. The typed version must match the workspace, so a mistyped dispatch
      #    fails here rather than publishing something unintended.
      # 2. The checked-out ref must BE the tag. A dispatch on `main` also
      #    satisfies (1) — the release commit is on main — so without this a run
      #    started after later commits landed would stage a tarball built from
      #    those commits under the tagged version number. Publishing something
      #    that isn't what v<version> points at is the one unrecoverable mistake
      #    here: npm never lets that version be republished.
      - name: Verify the requested version matches the workspace and the tag
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          WANT="${REQUESTED#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$WANT" != "$PKG" ]; then
            echo "Requested $WANT but the workspace is at $PKG (run scripts/sync-version.mjs)"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/v$WANT" ]; then
            echo "Dispatched on $GITHUB_REF, not the tag. Re-run it on the tag:"
            echo "  gh workflow run release.yml --ref v$WANT -f version=$WANT"
            exit 1
          fi

      # turbo ^build orders the graph: source libs -> daemon bundle ->
      - run: pnpm build

      # Published with npm, not pnpm, so npm's TRUSTED PUBLISHING (OIDC) does
      # the auth — there is no NPM_TOKEN anywhere in this workflow, and none in
      # the repo's secrets. GitHub mints a short-lived OIDC token (hence
      # `id-token: write` above), npm verifies it against the trusted publisher
      # configured on the package, and provenance is attested automatically.
      #
      # pnpm 12 installs and builds the workspace; npm handles the staged
      # release. There is exactly ONE public package with zero runtime deps.
      # Its `workspace:*` specs are devDependencies, which consumers never
      # install, so publishing needs no pnpm workspace dependency rewriting.
      #
      # Pin the reviewed npm release rather than inheriting Node's bundled
      # version. npm 12 includes trusted and staged publishing, and requires
      # Node >= 24.15 on the Node 24 release line selected by .nvmrc.
      #
      # apps/dailies/LICENSE is materialized by `pnpm build` above (npm, unlike
      # pnpm, will not copy the workspace-root LICENSE into the tarball).
      - name: Install npm for trusted publishing
        run: npm install -g npm@12.0.2

      # STAGED, not live: the trusted publisher is configured to allow
      # `npm stage publish` only, so this uploads the tarball to npm in a
      # non-public holding state. A maintainer then promotes it with
      # `npm stage approve <stage-id>` (2FA) or discards it with
      # `npm stage reject <stage-id>`. That human gate is the point — CI can
      # never make a release public on its own.
      - name: Stage the release on npm (trusted publishing, no token)
        run: npm stage publish --access public --provenance
        working-directory: apps/dailies

      - name: Where to find the staged release
        run: |
          echo "Staged. Review and promote it with:"
          echo "  npm stage list dailies-cli"
          echo "  npm stage view <stage-id>"
          echo "  npm stage approve <stage-id>   # 2FA — makes it public"
          echo "  npm stage reject <stage-id>    # discards it"
