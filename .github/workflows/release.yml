name: Release

# Publishes the public packages to npm. Deliberately MANUAL: publishing is
# triggered by running this workflow and typing the version, never as a side
# effect of pushing a tag. Tagging a release and publishing it are separate
# decisions, and an accidental `git push --tags` must not reach the registry.
#
# To release: `node scripts/sync-version.mjs <version>`, commit, tag, push —
# then run this workflow from the Actions tab (or `gh workflow run release.yml
# -f version=X.Y.Z`) and confirm. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json, e.g. 0.5.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # mints the OIDC token npm trusted publishing verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # NB: deliberately NO `registry-url:` here. setup-node would write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
      # and with trusted publishing there is no NODE_AUTH_TOKEN — so npm sends
      # an EMPTY token and the registry rejects the write with E401 instead of
      # npm falling back to OIDC. (Provenance still signs fine, which makes the
      # failure look unrelated to auth.) npm defaults to registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The typed version must match the workspace, so a mistyped dispatch fails
      # here rather than publishing something unintended.
      - name: Verify the requested version matches the workspace
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          WANT="${REQUESTED#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$WANT" != "$PKG" ]; then
            echo "Requested $WANT but the workspace is at $PKG (run scripts/sync-version.mjs)"
            exit 1
          fi

      # turbo ^build orders the graph: source libs -> daemon bundle ->
      - run: pnpm build

      # Published with npm, not pnpm, so npm's TRUSTED PUBLISHING (OIDC) does
      # the auth — there is no NPM_TOKEN anywhere in this workflow, and none in
      # the repo's secrets. GitHub mints a short-lived OIDC token (hence
      # `id-token: write` above), npm verifies it against the trusted publisher
      # configured on the package, and provenance is attested automatically.
      #
      # Why npm and not `pnpm -r publish`: OIDC landed natively in pnpm 10, and
      # this repo is on pnpm 9.15 because pnpm 10 stopped running dependency
      # build scripts by default (esbuild/sharp/Playwright need them). Since the
      # consolidation there is exactly ONE public package with ZERO runtime
      # deps and no `workspace:*`, so pnpm's rewriting has nothing to do and
      # plain `npm publish` from the package dir is equivalent.
      #
      # npm's bundled version on Node 22 is 10.x. Trusted publishing needs
      # >= 11.5.1 and STAGED publishing >= 11.15.0, so the higher floor wins.
      # Pinned to the 11.x line rather than `@latest` so a new npm major cannot
      # silently change release behavior.
      #
      # apps/dailies/LICENSE is materialized by `pnpm build` above (npm, unlike
      # pnpm, will not copy the workspace-root LICENSE into the tarball).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.15.0

      # STAGED, not live: the trusted publisher is configured to allow
      # `npm stage publish` only, so this uploads the tarball to npm in a
      # non-public holding state. A maintainer then promotes it with
      # `npm stage approve <stage-id>` (2FA) or discards it with
      # `npm stage reject <stage-id>`. That human gate is the point — CI can
      # never make a release public on its own.
      # Temporary: trusted-publishing failures surface as a bare ENEEDAUTH with
      # no diagnostic (npm/cli#9088), so confirm the preconditions explicitly.
      - name: Diagnose OIDC preconditions
        run: |
          echo "npm:  $(npm --version)   node: $(node --version)"
          echo "OIDC request URL set:   ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC request token set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "registry:   $(npm config get registry)"
          echo "userconfig: $(npm config get userconfig)"
          for f in "$(npm config get userconfig)" "$HOME/.npmrc" ./.npmrc; do
            if [ -f "$f" ]; then
              echo "## $f"
              sed 's/\(_authToken=\).*/\1<redacted>/' "$f"
            else
              echo "## $f (absent)"
            fi
          done

      - name: Stage the release on npm (trusted publishing, no token)
        run: npm stage publish --access public --provenance
        working-directory: apps/dailies

      - name: Where to find the staged release
        run: |
          echo "Staged. Review and promote it with:"
          echo "  npm stage list dailies-cli"
          echo "  npm stage view <stage-id>"
          echo "  npm stage approve <stage-id>   # 2FA — makes it public"
          echo "  npm stage reject <stage-id>    # discards it"
