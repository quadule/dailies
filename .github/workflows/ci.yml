name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.1", "24"]
    steps:
      - uses: actions/checkout@v7.0.1

      # package.json's packageManager is the single pnpm version pin.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check (ultracite/biome)
        run: pnpm lint

      # Workflows aren't covered by ultracite, and a bug in one only shows up
      # when it runs — which for the nightly demo means a day later. actionlint
      # also runs shellcheck over every `run:` block; it caught unquoted
      # expansions in dailies-demo.yml that had shipped unnoticed.
      - name: Lint the workflows (actionlint + shellcheck)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Install Playwright browsers (for daemon + dailies tests)
        run: pnpm --filter dailies-daemon exec playwright install --with-deps chromium

      - run: pnpm check
